# v1.2.3 のようなタグをプッシュすると、make-dist.ps1 で Velopack のインストーラーと更新パッケージを作り、GitHub Releases に公開する
# 利用者は https://github.com/Kinefuchi1942/MyDashboard/releases/latest/download/MyDashboard-win-Setup.exe から常に最新版を入れられる
# 入れたあとはアプリが最新リリースの releases.win.json と *.nupkg を読んで更新する
name: リリース

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # タグと csproj の <Version> がずれていると、exe のプロパティとリリース名が食い違う
      - name: タグとバージョンの一致を確認
        id: version
        run: |
          $csproj = 'MyDashboard.csproj'
          $version = ([xml](Get-Content $csproj -Encoding UTF8)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "タグ $env:GITHUB_REF_NAME と $csproj の <Version>$version</Version> が一致しません。"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      # 手元で使うときと同じ Windows PowerShell で動かす（PresentMon のダウンロードと埋め込みもここで行う）
      - name: インストーラーと更新パッケージを作る
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./make-dist.ps1

      # ファイル名は固定なので、releases/latest/download/MyDashboard-win-Setup.exe が常に最新版を指す
      - name: リリースを作る
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $notes = @"
          ## ダウンロード

          - **MyDashboard-win-Setup.exe** … インストーラーです。ダブルクリックするとインストールして起動します。以後の更新はアプリの右クリックメニューから行えます
          - **MyDashboard-win-Portable.zip** … インストールせずに使う場合はこちら。好きなフォルダに展開して MyDashboard.exe を起動してください

          設定は %APPDATA%\MyDashboard に保存されます。使い方・設定・自動起動は [README](https://github.com/$env:GITHUB_REPOSITORY#readme) を参照してください。
          "@
          $files = Get-ChildItem dist/releases -File | Where-Object { $_.Name -match '\.(exe|zip|nupkg)$' -or $_.Name -eq 'releases.win.json' }
          gh release create $env:GITHUB_REF_NAME @($files.FullName) `
            --title "MyDashboard $env:VERSION" --notes $notes --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'リリースの作成に失敗しました。' }
