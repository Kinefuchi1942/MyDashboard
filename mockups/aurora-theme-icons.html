<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1920px;height:1080px;overflow:hidden;background:#070A12 url(media-card-actual-news.png) 0 0/1920px 1080px no-repeat;font-family:"Yu Gothic UI",sans-serif;color:#F4F7FB;position:relative}
.strip{position:absolute;display:flex;flex-direction:column;align-items:center;gap:8px}
.auto{font-size:15px;color:rgba(201,207,219,.55);letter-spacing:.05em}
.pill{display:flex;flex-direction:column;gap:8px;padding:6px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09)}
.b{position:relative;width:46px;height:46px;border-radius:11px;overflow:hidden;opacity:.55;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.b.on{opacity:1;outline:2px solid rgba(244,247,251,.85);outline-offset:3px}
.b svg{position:absolute;left:9px;top:9px;width:28px;height:28px;overflow:visible}
.m{background:radial-gradient(circle at 15% 100%,rgba(255,183,116,.85),transparent 60%),radial-gradient(circle at 100% 0%,rgba(156,203,242,.55),transparent 60%),linear-gradient(#C9DDF2,#EBDCE0,#FAD9BE)}
.d{background:radial-gradient(circle at 0% 0%,rgba(255,255,255,.85),transparent 55%),radial-gradient(circle at 15% 100%,rgba(127,224,216,.45),transparent 60%),linear-gradient(#6FB8EE,#A8D8F6,#E4F3FC)}
.e{background:radial-gradient(circle at 100% 100%,rgba(240,122,58,.6),transparent 60%),radial-gradient(circle at 0% 100%,rgba(194,70,142,.5),transparent 60%),radial-gradient(circle at 100% 0%,rgba(106,75,216,.5),transparent 60%),linear-gradient(#2A1A44,#3A1D3E,#4A2230)}
.n{background:radial-gradient(circle at 100% 0%,rgba(43,52,128,.55),transparent 65%),radial-gradient(circle at 0% 100%,rgba(23,60,90,.45),transparent 60%),linear-gradient(#06080F,#070912,#05060B)}
.note{position:absolute;font-size:20px;color:#FFB547}
.ring{position:absolute;border:2px dashed rgba(255,181,71,.8);border-radius:20px}
</style></head><body>

<!-- 画面の右端・メディアカードの右側に縦並び（上端はメディアカードにそろえる） -->
<div class="strip" style="left:1840px;top:48px">
  <span class="auto">自動</span>
  <div class="pill">
    <!-- 朝 -->
    <div class="b m" title="朝"><svg viewBox="0 0 28 28" fill="none" stroke="#E2793A" stroke-width="2.2" stroke-linecap="round">
      <path d="M7 19a7 7 0 0 1 14 0"/><line x1="3" y1="23" x2="25" y2="23"/><line x1="14" y1="3" x2="14" y2="8"/><polyline points="11,6 14,3 17,6"/></svg></div>
    <!-- 昼 -->
    <div class="b d" title="昼"><svg viewBox="0 0 28 28" fill="none" stroke="#F2A900" stroke-width="2.2" stroke-linecap="round">
      <circle cx="14" cy="14" r="5.5" fill="#FFD45A"/>
      <line x1="14" y1="2" x2="14" y2="5"/><line x1="14" y1="23" x2="14" y2="26"/><line x1="2" y1="14" x2="5" y2="14"/><line x1="23" y1="14" x2="26" y2="14"/>
      <line x1="5.5" y1="5.5" x2="7.6" y2="7.6"/><line x1="20.4" y1="20.4" x2="22.5" y2="22.5"/><line x1="5.5" y1="22.5" x2="7.6" y2="20.4"/><line x1="20.4" y1="7.6" x2="22.5" y2="5.5"/></svg></div>
    <!-- 夕方 -->
    <div class="b e" title="夕方"><svg viewBox="0 0 28 28" fill="none" stroke="#FFB38A" stroke-width="2.2" stroke-linecap="round">
      <path d="M7 19a7 7 0 0 1 14 0"/><line x1="3" y1="23" x2="25" y2="23"/><line x1="14" y1="3" x2="14" y2="8"/><polyline points="11,5 14,8 17,5"/></svg></div>
    <!-- 夜（いま選ばれている） -->
    <div class="b n on" title="夜"><svg viewBox="0 0 28 28" fill="#8E9CFF" fill-opacity=".35" stroke="#AEB8FF" stroke-width="2" stroke-linejoin="round">
      <path d="M19.5 18.5A9 9 0 0 1 10.5 4.5a9.5 9.5 0 1 0 13 11 9 9 0 0 1-4 3z"/><circle cx="21" cy="6" r=".9" fill="#AEB8FF" stroke="none"/><circle cx="24" cy="10" r=".6" fill="#AEB8FF" stroke="none"/></svg></div>
  </div>
</div>

<div class="ring" style="left:1832px;top:40px;width:76px;height:262px"></div>
<div class="note" style="left:1834px;top:310px;font-size:16px;line-height:1.3;text-align:center;width:72px">↑<br>新しい<br>テーマ<br>切替</div>
</body></html>
