<!doctype html>
<html lang="ja"><head><meta charset="utf-8">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1920px;height:1080px;overflow:hidden;background:#070A12;font-family:"Yu Gothic UI","IPAPGothic",sans-serif;color:#F4F7FB;position:relative}
.num{font-family:Bahnschrift,"DejaVu Sans Condensed",sans-serif}
.glow{position:absolute;border-radius:50%;filter:blur(10px)}
.card{position:absolute;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:24px}
.t70{color:rgba(244,247,251,.7)}.t60{color:rgba(244,247,251,.6)}.t50{color:rgba(244,247,251,.5)}
.bar{position:absolute;left:96px;right:96px;bottom:84px;height:120px;display:grid;grid-template-columns:repeat(6,1fr)}
.cell{padding:0 22px;border-left:1px solid rgba(255,255,255,.12);display:flex;align-items:center;justify-content:space-between}
.cell:first-child{border:0}
.lab{font-size:18px;color:rgba(244,247,251,.6)}
.val{font-size:34px;font-weight:300}
.side{font-size:17px;color:rgba(244,247,251,.5);text-align:right}
svg{display:block;margin-top:6px}
.new{position:absolute;border:3px dashed rgba(255,181,71,.85);border-radius:20px;pointer-events:none}
.newlabel{position:absolute;color:#FFB547;font-size:20px}
</style></head><body>

</div>
