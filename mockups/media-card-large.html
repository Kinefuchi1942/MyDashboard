*{box-sizing:border-box;margin:0;padding:0}
body{width:1920px;height:1080px;overflow:hidden;background:#070A12;font-family:"Yu Gothic UI",sans-serif;color:#F4F7FB;position:relative}
.num{font-family:Bahnschrift,sans-serif}
.glow{position:absolute;border-radius:50%;filter:blur(10px)}
.card{position:absolute;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:24px}

.seg span{padding:4px 16px 5px;border-radius:15px;font-size:17px}
.chip{display:inline-flex;align-items:center;gap:10px;height:58px;padding:0 18px 0 9px;border:1px solid rgba(255,255,255,.12);border-radius:29px;margin-right:10px;font-size:19px}
.av{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.18)}
.bar{position:absolute;left:96px;right:96px;bottom:84px;height:120px;display:grid;grid-template-columns:repeat(5,1fr)}
.bar div{padding:26px;border-left:1px solid rgba(255,255,255,.12)}.bar div:first-child{border:0}
.btn{width:42px;height:42px;border-radius:21px;border:1.5px solid rgba(244,247,251,.4);display:inline-flex;align-items:center;justify-content:center;font-size:22px}
