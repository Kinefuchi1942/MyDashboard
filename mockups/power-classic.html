<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<!-- 消費電力（推定）：標準レイアウト。ヘッダーの時計の左に追加 -->
<style>

body{width:1920px;height:1080px;overflow:hidden;background:#0F141B;font-family:"Yu Gothic UI","IPAPGothic",sans-serif;color:#E8ECF2;position:relative}
.num{font-family:Bahnschrift,"DejaVu Sans Condensed",sans-serif}
.dim{color:#8592A5}
.panel{position:absolute;background:#161D26;border:1px solid #243040;border-radius:18px}
.h{font-size:24px;font-weight:600}
.new{position:absolute;border:3px dashed rgba(255,181,71,.85);border-radius:16px;pointer-events:none}
.newlabel{position:absolute;color:#FFB547;font-size:20px}
.stat{font-size:16px;color:#8592A5;margin-top:10px}.statv{font-size:30px}

<div style="position:absolute;left:32px;top:28px;height:64px;display:flex;align-items:center">

<div class="new" style="right:326px;top:22px;width:490px;height:78px"></div>

<div style="position:absolute;right:32px;top:28px;height:64px;display:flex;align-items:flex-end">

    <div><div class="h"><span style="display:inline-block;width:6px;height:26px;background:#5CC8D7;border-radius:2px;margin-right:12px;vertical-align:-4px"></span>CPU</div>
      <div class="dim" style="font-size:18px;margin-left:18px">Intel Core i7-14700K</div>
