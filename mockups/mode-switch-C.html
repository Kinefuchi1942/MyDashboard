<!doctype html><html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="mode-switch.css"><style>
.dim{position:absolute;inset:0;background:rgba(5,7,14,.45)}
.panel{position:absolute;left:50%;transform:translateX(-50%);top:744px;padding:22px 26px 20px;border-radius:24px;display:flex;gap:22px}
.t{width:300px;display:flex;flex-direction:column;gap:10px;align-items:center;font-size:19px;color:rgba(244,247,251,.7)}
.t .img{width:300px;height:169px;border-radius:12px;background-size:cover;border:2px solid rgba(255,255,255,.12)}
.t.on{color:#F4F7FB}.t.on .img{border-color:#8E9CFF;box-shadow:0 0 0 3px rgba(142,156,255,.35)}
.t .auto{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;background:rgba(255,255,255,.05);font-size:17px;color:rgba(244,247,251,.6);text-align:center;line-height:1.5}
.hint{position:absolute;left:50%;transform:translateX(-50%);top:1044px;font-size:15px;color:rgba(244,247,251,.5)}
</style></head><body>
<div class="dim"></div>
<div class="cap"><b>案C</b>普段は何も出さず、マウスを画面の下端に寄せたときだけ写真つきの一覧が出る（5秒で自動で消える）</div>
<div class="panel glass">
 <div class="t"><div class="img" style="background-image:url(../docs/images/classic.png)"></div>標準</div>
 <div class="t"><div class="img" style="background-image:url(../docs/images/gauge.png)"></div>計器盤</div>
 <div class="t on"><div class="img" style="background-image:url(../docs/images/aurora-night.png)"></div>オーロラ</div>
 <div class="t"><div class="img auto"><span style="font-size:24px;color:#F4F7FB">自動</span>ゲーム中 → 計器盤<br>それ以外 → オーロラ</div>自動</div>
</div>
<div class="hint">クリックで切り替え　・　L キーでも順に切り替え</div>
</body></html>
