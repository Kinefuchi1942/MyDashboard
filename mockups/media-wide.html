<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><link rel="stylesheet" href="youtube-base.css">
<style>
html{background:#070A12}
.seg span.on{background:#9146FF}
.live{background:#E91916}
.video{background:linear-gradient(135deg,#2b1a4d,#120d1e 55%,#24123a);border-radius:6px 0 0 6px;font-size:30px}
.chat{background:#18181B;border-left:1px solid #2f2f35;border-radius:0 6px 6px 0;padding:16px 20px;font-size:18px;line-height:2.1;overflow:hidden}
.tag{position:absolute;left:50%;transform:translateX(-50%);top:-2px;background:#FFB547;color:#1a1300;font-weight:700;font-size:26px;padding:6px 26px;border-radius:0 0 14px 14px;z-index:5}
.dim{position:absolute;color:#FFB547;font-family:Bahnschrift,sans-serif;font-size:22px;background:rgba(0,0,0,.55);padding:2px 10px;border-radius:6px}
.stat{display:inline-flex;gap:6px;align-items:baseline;font-size:16px}
.stat b{font-family:Bahnschrift,sans-serif;font-size:22px;font-weight:400}
</style></head><body>
<div class="glow" style="left:-380px;top:300px;width:1300px;height:1100px;background:radial-gradient(rgba(29,143,166,.4),transparent 70%)"></div>
<div class="glow" style="left:680px;top:-420px;width:1550px;height:1350px;background:radial-gradient(rgba(106,75,216,.4),transparent 70%)"></div>
<div id="root"></div>
<script>
// 1920×1080 基準。カード内：上下 20・左右 28 の余白、見出し 44、映像の上 16、チャンネル一覧 14+58
const V = {
  now: {tag:"現在", x:96, w:1728, slot:562, chat:673, clockOut:true, chips:true, bar:true, y:124},
  A:   {tag:"案A　上に広げる（下のPCバーはそのまま）", x:96, w:1728, slot:638, chat:538, chips:true, bar:true, y:48},
  B:   {tag:"案B　PCバーを隠して大きく（数値は見出しに小さく）", x:48, w:1824, slot:770, chat:400, chips:true, bar:false},
  C:   {tag:"案C　映像を最大に（チャンネル一覧も省く）", x:24, w:1872, slot:830, chat:340, chips:false, bar:false},
}[location.hash.slice(1) || "now"];
const vw = Math.round(V.slot * 16 / 9);
const h = 40 + 44 + 16 + V.slot + (V.chips ? 72 : 0);
const y = V.y ?? Math.round((1080 - h) / 2);
const stats = `<span class="stat t60">CPU <b style="color:#5CC8D7">12%</b></span><span class="stat t60">GPU <b style="color:#8E9CFF">8%</b></span><span class="stat t60">メモリ <b style="color:#6FD3A8">41%</b></span><span class="stat t60">FPS <b>—</b></span>`;
const chat = ["こんばんは","きた！","888","今日は何やるの？","ナイス！","草","おつです","わこつ","うまい","いいね","がんばれ","かわいい","すごい","w","おお"]
  .map((m,i)=>`<div><span style="color:${["#FF7F50","#1E90FF","#9ACD32","#DAA520","#FF69B4"][i%5]};font-weight:700">viewer${i+1}</span>　${m}</div>`).join("");
const chip = (n,t,on)=>`<div class="chip${on?" on":""}" style="${on?"background:rgba(145,70,255,.2);border-color:rgba(145,70,255,.9)":""}"><div class="av"><div class="dot"></div></div><div style="margin-left:10px"><div class="l1">${n} <span class="live">LIVE</span></div><div class="l2">${t}</div></div></div>`;
document.getElementById("root").innerHTML = `
<div class="tag">${V.tag}</div>
${V.clockOut ? `<div style="position:absolute;right:96px;top:14px;display:flex;align-items:center;gap:22px"><span class="num" style="font-size:84px;font-weight:300">21:48</span><span class="num t70" style="font-size:34px;margin-top:10px">18°</span></div>` : ""}
<div class="card" style="left:${V.x}px;top:${y}px;width:${V.w}px;height:${h}px;padding:20px 28px">
  <div style="display:flex;align-items:center;gap:14px;height:44px;white-space:nowrap">
    ${V.clockOut ? "" : `<span class="num" style="font-size:40px;font-weight:300">21:48</span><span class="num t70" style="font-size:22px">18°</span>`}
    <div class="seg" style="margin-left:${V.clockOut?0:10}px"><span>ニュース</span><span class="on">Twitch</span><span>YouTube</span></div>
    <div class="av" style="width:40px;height:40px;margin-left:8px"></div>
    <span style="font-size:26px;font-weight:600">チャンネル名</span><span class="t60" style="font-size:19px">配信タイトルがここに入ります</span>
    <span class="live" style="font-size:15px;padding:2px 8px">LIVE</span><span class="num t70" style="font-size:20px">5,678 人</span><span class="num t50" style="font-size:20px">1:02:33</span>
    <div style="flex:1"></div>
    ${V.bar ? "" : `<div style="display:flex;gap:18px;margin-right:10px">${stats}</div>`}
    <span class="pill">⛶ 通常表示</span>
  </div>
  <div style="display:flex;margin-top:16px;height:${V.slot}px;position:relative">
    <div class="video" style="width:${vw}px;height:${V.slot}px">映像（16:9）</div>
    <div class="chat t70" style="flex:1"><div style="color:#fff;font-weight:700;border-bottom:1px solid #2f2f35;padding-bottom:8px;margin-bottom:8px">チャット</div>${chat}</div>
    <span class="dim" style="left:16px;top:14px">映像 ${vw} × ${V.slot}</span>
    <span class="dim" style="right:16px;top:14px">チャット幅 ${V.chat}</span>
  </div>
  ${V.chips ? `<div class="row" style="margin-top:14px;height:58px"><span class="lbl" style="margin:0 6px 0 0">配信中（3）</span><span class="arrow">‹</span>${chip("チャンネルA","配信タイトル…",true)}${chip("チャンネルB","雑談配信")}${chip("チャンネルC","ゲーム実況")}<span style="flex:1"></span><span class="arrow">›</span></div>` : ""}
</div>
${V.bar ? `<div class="card bar">
  <div><div class="t60" style="font-size:18px">CPU</div><div class="num" style="font-size:34px;color:#5CC8D7">12%</div></div>
  <div><div class="t60" style="font-size:18px">GPU</div><div class="num" style="font-size:34px;color:#8E9CFF">8%</div></div>
  <div><div class="t60" style="font-size:18px">メモリ</div><div class="num" style="font-size:34px;color:#6FD3A8">41%</div></div>
  <div><div class="t60" style="font-size:18px">VRAM</div><div class="num" style="font-size:34px">2.1 GB</div></div>
  <div><div class="t60" style="font-size:18px">ネット</div><div class="num" style="font-size:34px;color:#7FB2F0">1.2 MB/s</div></div>
</div>` : ""}`;
</script>
</body></html>
